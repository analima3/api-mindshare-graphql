version: "1"
services:
  - type: web
    name: api-mindshare-graphql
    runtime: node
    repo: https://github.com/analima3/api-mindshare-graphql
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
