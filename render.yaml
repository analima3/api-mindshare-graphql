version: "1"
services:
  - type: web
    name: api-mindshare-graphql
    runtime: node
    repo: https://github.com/analima3/api-mindshare-graphql
    branch: main
    plan: free
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_SECRET
        generateValue: true
    region: ohio
    buildCommand: npm ci && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
